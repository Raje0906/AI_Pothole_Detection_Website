services:
  - type: web
    name: pothole-detection-app
    env: python
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p uploads reports models
      wget https://github.com/ultralytics/assets/releases/download/v0.0.0/yolov8n.pt -O yolov8n.pt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.12
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true
